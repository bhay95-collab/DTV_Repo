# XcodeGen spec. On your Mac:
#   brew install xcodegen
#   cd ios && xcodegen
#   open TreadSync.xcodeproj
name: TreadSync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  TreadSync:
    type: application
    platform: iOS
    sources: [TreadSync]
    settings:
      base:
        # Change this to something unique to you, e.g. com.yourname.treadsync
        PRODUCT_BUNDLE_IDENTIFIER: com.example.treadsync
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: TreadSync/Info.plist
      properties:
        CFBundleDisplayName: TreadSync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: TreadSync connects to your treadmill to read speed and distance.
        NSHealthShareUsageDescription: TreadSync reads your weight to estimate calories burned.
        NSHealthUpdateUsageDescription: TreadSync saves your treadmill workouts to Apple Health.
        # Keep receiving treadmill data while the phone is locked.
        UIBackgroundModes: [bluetooth-central]
    entitlements:
      path: TreadSync/TreadSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  TreadSyncTests:
    type: bundle.unit-test
    platform: iOS
    # Tests compile the pure-logic files directly; no app host or device needed.
    sources: [TreadSync/Core, TreadSyncTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.treadsync.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TreadSync:
    build:
      targets:
        TreadSync: all
        TreadSyncTests: [test]
    test:
      targets: [TreadSyncTests]
